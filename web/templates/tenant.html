{{define "base"}}<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>{{.Title}} · Voucher Kantin UPITRA</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="tenant">
<div class="shell">
<main>{{template "content" .}}</main>
<nav class="tabs" aria-label="Menu tenant">
  <a href="/scan"{{if eq .Tab "scan"}} aria-current="page"{{end}}>Scan</a>
  <a href="/today"{{if eq .Tab "today"}} aria-current="page"{{end}}>Hari ini</a>
</nav>
</div>
{{block "scripts" .}}{{end}}
</body>
</html>{{end}}
