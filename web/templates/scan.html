{{define "content"}}
<header class="topbar">
  <div>
    <div class="topbar-row">
      <strong>{{.Tenant.Name}}</strong>
      <a href="/masuk" class="linkbtn small switch-stall">Ganti Stan</a>
    </div>
    <span class="muted small">{{.Tenant.Stall}}</span>
  </div>
  <div class="right">
    <span class="muted small">Hari ini</span>
    <strong id="total">{{.Count}} · {{rupiah .Total}}</strong>
  </div>
</header>

<section class="cam" aria-label="Kamera pemindai">
  <video id="video" playsinline muted></video>
  <div class="frame" aria-hidden="true"></div>
  <p id="hint" class="hint" role="status">Menyalakan kamera…</p>
</section>

<section class="actions">
  <button id="menu-btn" class="btn" type="button" aria-expanded="false" aria-controls="menu-sheet">Pilih menu <span id="menu-count" class="badge" hidden></span></button>
  <p id="cart-sum" class="cart-sum small" hidden></p>
  <button id="manual-btn" class="btn" type="button" aria-expanded="false" aria-controls="manual">Ketik kode cadangan</button>
  <form id="manual" class="manual" hidden>
    <label for="code" class="small muted">Kode di bawah QR, contoh K7M4-QXP8</label>
    <input id="code" name="code" class="field" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12">
    <button class="btn primary" type="submit">Periksa voucher</button>
  </form>
  <p class="muted small center">Butuh koneksi internet untuk memeriksa voucher</p>
</section>

<div id="menu-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden>
  <div class="sheet-head">
    <h2 id="menu-title">Menu {{.Tenant.Name}}</h2>
    <button id="menu-clear" class="linkbtn small" type="button">Kosongkan</button>
  </div>
  <p id="menu-msg" class="muted small pad" role="status"></p>
  <ul id="menu-list" class="menulist"></ul>
  <div class="sheet-foot">
    <div><span class="muted small">Total pesanan</span><strong id="menu-total">Rp0</strong></div>
    <button id="menu-done" class="btn primary" type="button">Selesai</button>
  </div>
</div>

<div id="result" class="res" role="alertdialog" aria-live="assertive" aria-labelledby="res-title" hidden>
  <p class="res-clock small"><span id="res-tenant">{{.Tenant.Name}}</span> <span id="res-time"></span></p>
  <div class="res-body">
    <div class="icon" aria-hidden="true">
      <svg id="icon-ok" viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <svg id="icon-bad" viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <h2 id="res-title"></h2>
    <p id="res-sub" class="res-sub"></p>
    <p id="res-note" class="res-note"></p>
    <div id="res-card" class="card" hidden>
      <span id="res-label" class="small muted"></span>
      <strong id="res-main"></strong>
      <span id="res-detail" class="small muted"></span>
    </div>
    <div id="res-order" class="card" hidden>
      <span class="small muted">Pesanan</span>
      <ul id="res-lines" class="res-lines"></ul>
      <strong id="res-pay"></strong>
    </div>
  </div>
  <button id="res-next" class="btn" type="button">Scan berikutnya</button>
</div>
{{end}}

{{define "scripts"}}<script src="/static/scan.js" defer></script>{{end}}
