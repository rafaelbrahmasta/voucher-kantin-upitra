{{define "content"}}
<div class="head">
  <div>
    <h1>Tenant baru</h1>
    <p class="muted"><a href="/admin/tenant">← Semua tenant</a></p>
  </div>
</div>
{{if .Error}}<p class="flash flash-err" role="alert">{{.Error}}</p>{{end}}
<section class="panel narrow">
  <form method="post" action="/admin/tenant" class="stack">
    <div><label for="name" class="small muted">Nama tenant</label>
      <input id="name" class="field" name="name" value="{{.In.Name}}" maxlength="100" required></div>
    <div><label for="owner" class="small muted">Nama pemilik</label>
      <input id="owner" class="field" name="owner" value="{{.In.Owner}}" maxlength="150" required></div>
    <div><label for="stall" class="small muted">Lokasi stan (opsional)</label>
      <input id="stall" class="field" name="stall" value="{{.In.Stall}}" maxlength="50"></div>
    <div class="pair">
      <div><label for="bank_name" class="small muted">Bank (opsional)</label>
        <input id="bank_name" class="field" name="bank_name" value="{{.In.BankName}}" maxlength="50"></div>
      <div><label for="bank_account" class="small muted">No. rekening (opsional)</label>
        <input id="bank_account" class="field" name="bank_account" value="{{.In.BankAccount}}" inputmode="numeric" maxlength="34"></div>
    </div>
    <div><button class="btn-s" type="submit">Simpan tenant</button></div>
  </form>
</section>
{{end}}
